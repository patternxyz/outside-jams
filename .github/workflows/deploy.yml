name: Deploy

on:
  workflow_call:
    inputs:
      image:
        description: Immutable Artifact Registry image URI to deploy
        required: true
        type: string
    secrets:
      DATABASE_URL:
        required: true
      SESSION_SECRET:
        required: true
      SPOTIFY_CLIENT_ID:
        required: true
      SPOTIFY_CLIENT_SECRET:
        required: true
      TOKEN_ENCRYPTION_KEY:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          image: ${{ inputs.image }}
          flags: --service-account=${{ vars.CLOUD_RUN_SERVICE_ACCOUNT_EMAIL }}
          env_vars: |-
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DB_SSL=${{ vars.DB_SSL }}
            DB_SYNCHRONIZE=${{ vars.DB_SYNCHRONIZE }}
            DB_RUN_MIGRATIONS=${{ vars.DB_RUN_MIGRATIONS }}
            API_RATE_LIMIT=${{ vars.API_RATE_LIMIT }}
            API_RATE_LIMIT_TTL_MS=${{ vars.API_RATE_LIMIT_TTL_MS }}
            API_BASE_URL=${{ vars.API_BASE_URL }}
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            GCP_REGION=${{ vars.GCP_REGION }}
            CLOUD_TASKS_QUEUE=${{ vars.CLOUD_TASKS_QUEUE }}
            CLOUD_TASKS_SERVICE_ACCOUNT_EMAIL=${{ vars.CLOUD_TASKS_SERVICE_ACCOUNT_EMAIL }}
            CLOUD_TASKS_AUDIENCE=${{ vars.CLOUD_TASKS_AUDIENCE }}
            TRUST_PROXY=true
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            TOKEN_ENCRYPTION_KEY=${{ secrets.TOKEN_ENCRYPTION_KEY }}
            SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
            SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
            SPOTIFY_TOKEN_CACHE_SIZE=${{ vars.SPOTIFY_TOKEN_CACHE_SIZE }}
            SPOTIFY_TOKEN_CACHE_TTL_MS=${{ vars.SPOTIFY_TOKEN_CACHE_TTL_MS }}

      - name: Grant the task identity access to the service
        run: >-
          gcloud run services add-iam-policy-binding "${{ vars.CLOUD_RUN_SERVICE }}"
          --region "${{ vars.GCP_REGION }}"
          --project "${{ vars.GCP_PROJECT_ID }}"
          --member "serviceAccount:${{ vars.CLOUD_TASKS_SERVICE_ACCOUNT_EMAIL }}"
          --role roles/run.invoker
          --quiet
